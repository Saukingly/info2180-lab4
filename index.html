<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Avengers Character Search</title>

    <link href="styles.css" type="text/css" rel="stylesheet" />

    <script src="app.js" type="text/javascript"></script>
</head>

<body>
    <header>
        <h1>Avengers Character Search</h1>
    </header>

    <main>
        <div id="controls">
            <label for="name">Name:</label>
            <input id="name" type="search" name="Avengers" placeholder="Enter an avenger Name" />
            <button id="lookup">Search</button>
        </div>

        <div id="result">
        </div>
    </main>

</body>

</html>
